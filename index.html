<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a3d20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jungle">
<title>Jungle Explorer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a1f0e;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: #e8d8a8;
  touch-action: none;
  overscroll-behavior: none;
}
#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#hud {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: calc(env(safe-area-inset-left, 0px) + 10px);
  padding: 8px 12px;
  background: rgba(8, 18, 12, 0.7);
  border: 1px solid rgba(232, 216, 168, 0.18);
  border-radius: 10px;
  font-size: 12px;
  line-height: 1.5;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  pointer-events: none;
  max-width: calc(100vw - 80px);
}
#hud .row { display: flex; gap: 10px; align-items: baseline; }
#hud .label { opacity: 0.55; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; min-width: 50px; }
#hud .val { font-weight: 600; color: #ffd97a; }

#menu {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  right: calc(env(safe-area-inset-right, 0px) + 10px);
  display: flex;
  gap: 8px;
}
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(8, 18, 12, 0.7);
  border: 1px solid rgba(232, 216, 168, 0.18);
  color: #e8d8a8;
  font-size: 18px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.1s, transform 0.05s;
}
.icon-btn:active { background: rgba(80, 140, 80, 0.7); transform: scale(0.95); }

#controls {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  right: calc(env(safe-area-inset-right, 0px) + 18px);
  width: 170px;
  height: 170px;
  pointer-events: none;
  z-index: 10;
}
.pad-btn {
  position: absolute;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(8, 18, 12, 0.75);
  border: 1.5px solid rgba(232, 216, 168, 0.32);
  color: #e8d8a8;
  font-size: 20px;
  pointer-events: auto;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.05s, transform 0.05s;
}
.pad-btn.active {
  background: rgba(110, 170, 90, 0.85);
  border-color: rgba(232, 216, 168, 0.7);
  transform: scale(0.94);
}
.pad-btn.up    { top: 0;        left: 57px; }
.pad-btn.left  { top: 57px;     left: 0; }
.pad-btn.right { top: 57px;     right: 0; }
.pad-btn.down  { bottom: 0;     left: 57px; }

#splash {
  position: fixed;
  inset: 0;
  background: rgba(8, 18, 12, 0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  z-index: 100;
  text-align: center;
  padding: 24px;
  backdrop-filter: blur(20px);
}
#splash h1 {
  font-size: 28px;
  font-weight: 600;
  color: #ffd97a;
  letter-spacing: 0.04em;
}
#splash p { opacity: 0.7; font-size: 13px; max-width: 320px; line-height: 1.5; }
#splash .controls-hint {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 14px;
  font-size: 12px;
  margin-top: 8px;
  opacity: 0.85;
}
#splash .controls-hint .k {
  background: rgba(232,216,168,0.1);
  padding: 2px 8px;
  border-radius: 4px;
  font-family: ui-monospace, Menlo, monospace;
  color: #ffd97a;
}
#splash button {
  margin-top: 12px;
  padding: 12px 28px;
  font-size: 14px;
  border-radius: 10px;
  background: linear-gradient(180deg, #4a8a28, #386818);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
  cursor: pointer;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
#splash button:active { transform: scale(0.97); }

/* Hide on-screen pad on devices with proper keyboard + mouse */
@media (hover: hover) and (pointer: fine) {
  #controls { display: none; }
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="row"><span class="label">Biome</span><span class="val" id="biome">—</span></div>
  <div class="row"><span class="label">Pos</span><span class="val" id="pos">0, 0</span></div>
  <div class="row"><span class="label">Seed</span><span class="val" id="seed">—</span></div>
</div>

<div id="menu">
  <button class="icon-btn" id="reroll" title="New world" aria-label="New world">⟳</button>
  <button class="icon-btn" id="info-btn" title="Info" aria-label="Info">?</button>
</div>

<div id="controls">
  <button class="pad-btn up"    data-dir="up"    aria-label="Up">▲</button>
  <button class="pad-btn left"  data-dir="left"  aria-label="Left">◀</button>
  <button class="pad-btn right" data-dir="right" aria-label="Right">▶</button>
  <button class="pad-btn down"  data-dir="down"  aria-label="Down">▼</button>
</div>

<div id="splash">
  <h1>Jungle Explorer</h1>
  <p>Wander an endless procedurally-generated isometric jungle.</p>
  <div class="controls-hint">
    <span class="k">Tap</span><span>D-pad to move</span>
    <span class="k">⌨</span><span>WASD or arrow keys</span>
    <span class="k">⟳</span><span>New world</span>
  </div>
  <button id="start-btn">Begin</button>
</div>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════════════════
//  Canvas + responsive sizing
// ════════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });

let DPR = 1;
let VIEW_W = 0, VIEW_H = 0;
let TILE_W = 48;          // width of an iso tile (px, CSS)
let TILE_H = 24;          // height of an iso tile (= TILE_W / 2)
let ELEV_PX = 4;          // pixels per elevation unit
let SCALE = 1;            // scale factor for decoration drawing

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  VIEW_W = window.innerWidth;
  VIEW_H = window.innerHeight;
  canvas.width  = Math.floor(VIEW_W * DPR);
  canvas.height = Math.floor(VIEW_H * DPR);
  canvas.style.width  = VIEW_W + 'px';
  canvas.style.height = VIEW_H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // Scale tile size to viewport — bigger tiles on bigger screens
  TILE_W = Math.max(40, Math.min(72, Math.round(Math.min(VIEW_W, VIEW_H) / 9)));
  if (TILE_W % 2) TILE_W -= 1;
  TILE_H = TILE_W / 2;
  ELEV_PX = Math.max(3, Math.round(TILE_H / 5));
  SCALE = TILE_W / 48;
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
resize();

// ════════════════════════════════════════════════════════════════════════════
//  Hash-based value noise + fBm
// ════════════════════════════════════════════════════════════════════════════
class Noise {
  constructor(seed) { this.seed = seed >>> 0; }
  hash01(x, y) {
    let h = (Math.imul(x | 0, 374761393) +
             Math.imul(y | 0, 668265263) +
             Math.imul(this.seed | 0, 1274126177)) >>> 0;
    h = (h ^ (h >>> 13)) >>> 0;
    h = Math.imul(h, 1274126177) >>> 0;
    h = (h ^ (h >>> 16)) >>> 0;
    return (h & 0xFFFFFF) / 0x1000000;
  }
  static smooth(t) { return t * t * (3 - 2 * t); }
  value(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const a = this.hash01(ix,     iy);
    const b = this.hash01(ix + 1, iy);
    const c = this.hash01(ix,     iy + 1);
    const d = this.hash01(ix + 1, iy + 1);
    const u = Noise.smooth(fx), v = Noise.smooth(fy);
    return (a * (1 - u) + b * u) * (1 - v) +
           (c * (1 - u) + d * u) *      v;
  }
  fbm(x, y, octaves) {
    let v = 0, amp = 1, freq = 1, total = 0;
    for (let i = 0; i < octaves; i++) {
      v     += this.value(x * freq, y * freq) * amp;
      total += amp;
      amp   *= 0.5;
      freq  *= 2.07;
    }
    return v / total;
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  Tile + biome definitions
// ════════════════════════════════════════════════════════════════════════════
const T = {
  DEEPWATER: 0, WATER: 1, SAND: 2, MUD: 3,
  GRASS: 4, JUNGLE: 5, HILL: 6, ROCK: 7
};
const BIOME_NAMES = [
  'Deep Water', 'Water',  'Beach',    'Swamp',
  'Clearing',   'Jungle', 'Highland', 'Peaks'
];

// Top / left-face / right-face colors for each biome
const VISUALS = {
  0: { top: '#1a3a5e', left: '#142d4a', right: '#0e2238' },
  1: { top: '#2d6a8f', left: '#235578', right: '#1a4360' },
  2: { top: '#e8d28a', left: '#c4a960', right: '#9c8548' },
  3: { top: '#6b4a2a', left: '#54381e', right: '#3d2814' },
  4: { top: '#7ab842', left: '#5a9230', right: '#446e22' },
  5: { top: '#4a8a28', left: '#386818', right: '#28480e' },
  6: { top: '#8a7048', left: '#6e5634', right: '#503e22' },
  7: { top: '#9a9a9a', left: '#787878', right: '#5a5a5a' }
};

// ════════════════════════════════════════════════════════════════════════════
//  Decoration drawing — each draws relative to the tile-top center (cx, cy)
//  with `scale` applied uniformly. `seed` allows per-instance variation.
// ════════════════════════════════════════════════════════════════════════════
function drawSmallTree(cx, cy, scale, seed) {
  const hueShift = (seed % 18) - 9;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 1, 6 * scale, 2.5 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  // trunk
  ctx.fillStyle = '#3a2410';
  ctx.fillRect(cx - 1.5 * scale, cy - 14 * scale, 3 * scale, 10 * scale);
  // crown (two stacked circles)
  ctx.fillStyle = `hsl(${100 + hueShift}, 48%, 22%)`;
  ctx.beginPath();
  ctx.arc(cx, cy - 16 * scale, 9 * scale, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = `hsl(${102 + hueShift}, 50%, 32%)`;
  ctx.beginPath();
  ctx.arc(cx - 2 * scale, cy - 19 * scale, 6 * scale, 0, Math.PI * 2);
  ctx.fill();
}

function drawBigTree(cx, cy, scale, seed) {
  const hueShift = (seed % 12) - 6;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 1, 9 * scale, 3.5 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  // trunk
  ctx.fillStyle = '#2e1c08';
  ctx.fillRect(cx - 2.5 * scale, cy - 18 * scale, 5 * scale, 14 * scale);
  // crown clusters
  ctx.fillStyle = `hsl(${110 + hueShift}, 45%, 18%)`;
  ctx.beginPath();
  ctx.arc(cx - 4 * scale, cy - 20 * scale, 8 * scale, 0, Math.PI * 2);
  ctx.arc(cx + 4 * scale, cy - 20 * scale, 8 * scale, 0, Math.PI * 2);
  ctx.arc(cx,             cy - 26 * scale, 10 * scale, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = `hsl(${112 + hueShift}, 48%, 28%)`;
  ctx.beginPath();
  ctx.arc(cx - 2 * scale, cy - 24 * scale, 6 * scale, 0, Math.PI * 2);
  ctx.arc(cx + 3 * scale, cy - 28 * scale, 5 * scale, 0, Math.PI * 2);
  ctx.fill();
}

function drawPalm(cx, cy, scale, seed) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 1, 5 * scale, 2 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  // curved trunk — lean direction from seed
  const lean = ((seed % 5) - 2) * 0.4 * scale;
  ctx.strokeStyle = '#6a4a28';
  ctx.lineWidth = 2.5 * scale;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, cy - 2);
  ctx.quadraticCurveTo(cx + lean, cy - 14 * scale, cx + lean * 1.3, cy - 22 * scale);
  ctx.stroke();
  // fronds
  const tx = cx + lean * 1.3;
  const ty = cy - 22 * scale;
  ctx.strokeStyle = 'hsl(82, 50%, 30%)';
  ctx.lineWidth = 2 * scale;
  for (const ang of [-2.4, -1.8, -1.2, -0.6, -1.5708, 0, 0.6, 1.2, 1.8, 2.4]) {
    const len = 7 * scale;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(
      tx + Math.cos(ang) * len * 0.6,
      ty + Math.sin(ang) * len * 0.6 + 2 * scale,
      tx + Math.cos(ang) * len,
      ty + Math.sin(ang) * len + 4 * scale
    );
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function drawFlower(cx, cy, scale, seed) {
  const colors = ['#ff6090', '#ffcc40', '#e040a0', '#d04040', '#a060ff'];
  const c = colors[seed % colors.length];
  // stem
  ctx.strokeStyle = '#3a6014';
  ctx.lineWidth = 0.8 * scale;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 1);
  ctx.lineTo(cx, cy - 4 * scale);
  ctx.stroke();
  // bloom
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.arc(cx, cy - 4 * scale, 1.6 * scale, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff8c0';
  ctx.beginPath();
  ctx.arc(cx, cy - 4 * scale, 0.6 * scale, 0, Math.PI * 2);
  ctx.fill();
}

function drawGrassTuft(cx, cy, scale, seed) {
  ctx.strokeStyle = '#5a8826';
  ctx.lineWidth = 0.8 * scale;
  ctx.lineCap = 'round';
  const offsets = [-2, 0, 2, -1, 1];
  for (let i = 0; i < 5; i++) {
    const x = cx + offsets[i] * scale;
    const sway = ((seed + i) % 3) - 1;
    ctx.beginPath();
    ctx.moveTo(x, cy);
    ctx.lineTo(x + sway * 0.4 * scale, cy - 3.5 * scale);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function drawRuin(cx, cy, scale, seed) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 1, 6 * scale, 2.5 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  // broken stone wall — column with stepped top
  ctx.fillStyle = '#888078';
  ctx.fillRect(cx - 4 * scale, cy - 12 * scale, 8 * scale, 12 * scale);
  ctx.fillStyle = '#6a635a';
  ctx.fillRect(cx - 4 * scale, cy - 12 * scale, 2 * scale, 12 * scale);   // shadow stripe
  ctx.fillStyle = '#a09890';
  ctx.fillRect(cx - 4 * scale, cy - 12 * scale, 8 * scale, 1.5 * scale);  // highlight top
  // broken notch
  ctx.fillStyle = '#0a1f0e';
  ctx.fillRect(cx - 1 * scale, cy - 12 * scale, 2 * scale, 3 * scale);
  // vines
  ctx.strokeStyle = '#3a6818';
  ctx.lineWidth = 0.8 * scale;
  ctx.beginPath();
  ctx.moveTo(cx + 3 * scale, cy - 12 * scale);
  ctx.lineTo(cx + 3 * scale, cy - 6 * scale);
  ctx.lineTo(cx + 4 * scale, cy - 3 * scale);
  ctx.stroke();
}

function drawVine(cx, cy, scale, seed) {
  ctx.strokeStyle = '#3a6818';
  ctx.lineWidth = 0.8 * scale;
  ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const x = cx + (i - 1) * 2 * scale;
    ctx.beginPath();
    ctx.moveTo(x, cy);
    ctx.bezierCurveTo(
      x - 1 * scale, cy - 1.5 * scale,
      x + 1 * scale, cy - 2.5 * scale,
      x,             cy - 3 * scale
    );
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function drawBush(cx, cy, scale, seed) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 1, 5 * scale, 2 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = `hsl(${110 + (seed % 10)}, 42%, 22%)`;
  ctx.beginPath();
  ctx.arc(cx - 2 * scale, cy - 2 * scale, 3 * scale, 0, Math.PI * 2);
  ctx.arc(cx + 2 * scale, cy - 2 * scale, 3 * scale, 0, Math.PI * 2);
  ctx.arc(cx,             cy - 4 * scale, 3.5 * scale, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = `hsl(${112 + (seed % 10)}, 45%, 32%)`;
  ctx.beginPath();
  ctx.arc(cx - 1 * scale, cy - 5 * scale, 1.5 * scale, 0, Math.PI * 2);
  ctx.fill();
}

function drawLog(cx, cy, scale, seed) {
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 1, 5 * scale, 1.5 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  // body
  ctx.fillStyle = '#6a4a28';
  ctx.beginPath();
  ctx.ellipse(cx, cy - 1.5 * scale, 6 * scale, 1.8 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  // end
  ctx.fillStyle = '#4a2f1a';
  ctx.beginPath();
  ctx.ellipse(cx + 5 * scale, cy - 1.5 * scale, 1.4 * scale, 1.8 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#3a2410';
  ctx.lineWidth = 0.6 * scale;
  ctx.beginPath();
  ctx.arc(cx + 5 * scale, cy - 1.5 * scale, 0.7 * scale, 0, Math.PI * 2);
  ctx.stroke();
}

// Index matches the C++ DECOS table for parity
const DECOS = [
  { name: 'small_tree', blocks: true,  draw: drawSmallTree },  // 0
  { name: 'big_tree',   blocks: true,  draw: drawBigTree   },  // 1
  { name: 'palm',       blocks: true,  draw: drawPalm      },  // 2
  { name: 'flower',     blocks: false, draw: drawFlower    },  // 3
  { name: 'grass_tuft', blocks: false, draw: drawGrassTuft },  // 4
  { name: 'ruin',       blocks: true,  draw: drawRuin      },  // 5
  { name: 'vine',       blocks: false, draw: drawVine      },  // 6
  { name: 'bush',       blocks: true,  draw: drawBush      },  // 7
  { name: 'log',        blocks: false, draw: drawLog       }   // 8
];

// ════════════════════════════════════════════════════════════════════════════
//  Infinite world — same generation rules as the C++ port
// ════════════════════════════════════════════════════════════════════════════
class World {
  constructor(seed) {
    this.seed = seed;
    this.nH = new Noise(seed);
    this.nM = new Noise((seed ^ 0xDEADBEEF) >>> 0);
    this.nD = new Noise((Math.imul(seed, 2654435761) + 1) >>> 0);
    this.cache = new Map();
  }
  key(x, y) { return x * 100000 + y; }   // collision-free for |coord| < 50k
  generate(x, y) {
    let h = this.nH.fbm(x * 0.035,        y * 0.035,        5);
    const m = this.nM.fbm(x * 0.025 + 73, y * 0.025 - 19,   3);
    const d = this.nD.hash01(x, y);
    const r = this.nD.hash01(x * 31 + 1, y * 17 + 1);
    h = Math.pow(h, 0.85);

    let type, elev, deco = -1;
    if (h < 0.25) {
      type = T.DEEPWATER; elev = 0;
    } else if (h < 0.32) {
      type = T.WATER; elev = 0;
    } else if (h < 0.36) {
      type = T.SAND; elev = 1;
      if (d < 0.05) deco = 8;
    } else if (h < 0.42 && m > 0.55) {
      type = T.MUD; elev = 1;
      if      (d < 0.10) deco = 6;
      else if (d < 0.13) deco = 7;
    } else if (h < 0.50) {
      type = T.GRASS; elev = 1 + Math.floor((h - 0.42) * 12);
      if      (d < 0.03) deco = 3;
      else if (d < 0.10) deco = 4;
      else if (d < 0.13 && m > 0.5) deco = 7;
    } else if (h < 0.72) {
      type = T.JUNGLE; elev = 2 + Math.floor((h - 0.50) * 15);
      if      (d < 0.18)             deco = 1;
      else if (d < 0.34)             deco = 0;
      else if (d < 0.40 && r > 0.5)  deco = 2;
      else if (d < 0.48)             deco = 7;
      else if (d < 0.52)             deco = 3;
      else if (d < 0.56)             deco = 6;
    } else if (h < 0.86) {
      type = T.HILL; elev = 5 + Math.floor((h - 0.72) * 25);
      if      (d < 0.20) deco = 1;
      else if (d < 0.25) deco = 5;
      else if (d < 0.30) deco = 8;
    } else {
      type = T.ROCK; elev = 8 + Math.floor((h - 0.86) * 35);
      if (d < 0.08) deco = 5;
    }
    // Per-tile lightness jitter (±5%) so identical biomes don't read as flat
    const tint = (this.nD.hash01(x + 7, y - 11) - 0.5) * 0.10;
    return { type, elev, deco, decoSeed: Math.floor(r * 1000), tint };
  }
  at(x, y) {
    const k = this.key(x, y);
    let t = this.cache.get(k);
    if (t === undefined) {
      t = this.generate(x, y);
      this.cache.set(k, t);
    }
    return t;
  }
  walkable(x, y) {
    const t = this.at(x, y);
    if (t.type === T.DEEPWATER || t.type === T.WATER || t.type === T.ROCK) return false;
    if (t.deco >= 0 && DECOS[t.deco].blocks) return false;
    return true;
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  Color helpers — apply per-tile lightness tint
// ════════════════════════════════════════════════════════════════════════════
function hex(c) {
  // '#RRGGBB' -> [r,g,b]
  return [parseInt(c.slice(1, 3), 16),
          parseInt(c.slice(3, 5), 16),
          parseInt(c.slice(5, 7), 16)];
}
function rgb(r, g, b) {
  r = Math.max(0, Math.min(255, r | 0));
  g = Math.max(0, Math.min(255, g | 0));
  b = Math.max(0, Math.min(255, b | 0));
  return `rgb(${r},${g},${b})`;
}
function tinted(color, tint) {
  // tint in [-0.10, +0.10] — additive in 0..255 space
  const [r, g, b] = hex(color);
  const k = tint * 255;
  return rgb(r + k, g + k, b + k);
}

// ════════════════════════════════════════════════════════════════════════════
//  Game state
// ════════════════════════════════════════════════════════════════════════════
let world;
let seed;
const player = {
  x: 0, y: 0,            // logical (target) tile
  vx: 0, vy: 0,          // visual (rendered) position
  startX: 0, startY: 0,  // animation start
  startElev: 0, targetElev: 0, vElev: 0,
  anim: 1,               // 0..1, 1 = idle
  time: 0,
  facing: 0              // 0=NW, 1=NE, 2=SE, 3=SW (visual flip)
};
const MOVE_SPEED = 8.5;  // animation rate (higher = quicker steps)

function newWorld(s) {
  seed = (s !== undefined && !isNaN(s)) ? (s >>> 0) : (Math.random() * 0xFFFFFFFF) >>> 0;
  world = new World(seed);
  // Spiral outward from origin for a friendly spawn
  for (let r = 0; r < 200; r++) {
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (r > 0 && Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const t = world.at(dx, dy);
        if ((t.type === T.GRASS || t.type === T.JUNGLE) && t.deco < 0) {
          player.x = dx; player.y = dy;
          player.vx = dx; player.vy = dy;
          player.startX = dx; player.startY = dy;
          player.startElev = t.elev;
          player.targetElev = t.elev;
          player.vElev = t.elev;
          player.anim = 1;
          updateHUD();
          location.hash = String(seed);
          return;
        }
      }
    }
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  Movement
// ════════════════════════════════════════════════════════════════════════════
const DIRS = {
  up:    { dx: -1, dy: -1, facing: 0 },
  right: { dx:  1, dy: -1, facing: 1 },
  down:  { dx:  1, dy:  1, facing: 2 },
  left:  { dx: -1, dy:  1, facing: 3 }
};
const heldDirs = new Set();

function tryMove(dx, dy, facing) {
  if (player.anim < 1) return false;
  if (!world.walkable(player.x + dx, player.y + dy)) return false;
  player.startX = player.x;
  player.startY = player.y;
  player.startElev = world.at(player.x, player.y).elev;
  player.x += dx;
  player.y += dy;
  player.targetElev = world.at(player.x, player.y).elev;
  player.anim = 0;
  if (facing !== undefined) player.facing = facing;
  return true;
}

function processInput() {
  if (player.anim < 1) return;
  // Priority order: up > down > left > right (arbitrary but consistent)
  for (const dirName of ['up', 'down', 'left', 'right']) {
    if (heldDirs.has(dirName)) {
      const d = DIRS[dirName];
      tryMove(d.dx, d.dy, d.facing);
      return;
    }
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  Iso projection
// ════════════════════════════════════════════════════════════════════════════
function worldToScreen(wx, wy, elev) {
  return {
    sx: (wx - wy) * (TILE_W / 2),
    sy: (wx + wy) * (TILE_H / 2) - elev * ELEV_PX
  };
}

// ════════════════════════════════════════════════════════════════════════════
//  Update loop
// ════════════════════════════════════════════════════════════════════════════
function easeInOutQuad(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2; }
function lerp(a, b, t)    { return a + (b - a) * t; }

function update(dt) {
  player.time += dt;
  if (player.anim < 1) {
    player.anim = Math.min(1, player.anim + dt * MOVE_SPEED);
    const t = easeInOutQuad(player.anim);
    player.vx    = lerp(player.startX,    player.x,           t);
    player.vy    = lerp(player.startY,    player.y,           t);
    player.vElev = lerp(player.startElev, player.targetElev,  t);
  } else {
    player.vx = player.x;
    player.vy = player.y;
    player.vElev = player.targetElev;
  }
  processInput();
}

// ════════════════════════════════════════════════════════════════════════════
//  Render
// ════════════════════════════════════════════════════════════════════════════
function drawTile(wx, wy) {
  const tile = world.at(wx, wy);
  const v = VISUALS[tile.type];
  const { sx, sy } = worldToScreen(wx, wy, tile.elev);
  const elevPx = tile.elev * ELEV_PX;

  // Side faces (only when elevated above ground baseline)
  if (elevPx > 0) {
    // Left face
    ctx.fillStyle = tinted(v.left, tile.tint);
    ctx.beginPath();
    ctx.moveTo(sx - TILE_W/2, sy);
    ctx.lineTo(sx,            sy + TILE_H/2);
    ctx.lineTo(sx,            sy + TILE_H/2 + elevPx);
    ctx.lineTo(sx - TILE_W/2, sy            + elevPx);
    ctx.closePath();
    ctx.fill();

    // Right face
    ctx.fillStyle = tinted(v.right, tile.tint);
    ctx.beginPath();
    ctx.moveTo(sx,            sy + TILE_H/2);
    ctx.lineTo(sx + TILE_W/2, sy);
    ctx.lineTo(sx + TILE_W/2, sy            + elevPx);
    ctx.lineTo(sx,            sy + TILE_H/2 + elevPx);
    ctx.closePath();
    ctx.fill();
  }

  // Top diamond
  ctx.fillStyle = tinted(v.top, tile.tint);
  ctx.beginPath();
  ctx.moveTo(sx,            sy - TILE_H/2);
  ctx.lineTo(sx + TILE_W/2, sy);
  ctx.lineTo(sx,            sy + TILE_H/2);
  ctx.lineTo(sx - TILE_W/2, sy);
  ctx.closePath();
  ctx.fill();

  // Animated water shimmer
  if (tile.type === T.WATER || tile.type === T.DEEPWATER) {
    const phase = player.time * 1.6 + wx * 0.5 + wy * 0.4;
    const shimmer = Math.sin(phase);
    if (shimmer > 0.55) {
      ctx.fillStyle = (tile.type === T.WATER)
        ? 'rgba(180, 220, 240, 0.18)'
        : 'rgba(120, 170, 220, 0.14)';
      ctx.beginPath();
      ctx.ellipse(
        sx + Math.cos(phase * 0.7) * 2,
        sy + Math.sin(phase * 0.5) * 1,
        TILE_W * 0.22, TILE_H * 0.22, 0, 0, Math.PI * 2
      );
      ctx.fill();
    }
  }

  // Decoration
  if (tile.deco >= 0) {
    DECOS[tile.deco].draw(sx, sy, SCALE, tile.decoSeed);
  }
}

function drawPlayer() {
  const { sx, sy } = worldToScreen(player.vx, player.vy, player.vElev);
  const s = SCALE;
  const moving = player.anim < 1;
  // Subtle bobbing while walking
  const bob = moving
    ? Math.abs(Math.sin(player.anim * Math.PI * 2)) * 1.5 * s
    : Math.sin(player.time * 2) * 0.4 * s;

  // Shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + 1, 6 * s, 2.5 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body (slightly flipped based on facing)
  const flip = (player.facing === 1 || player.facing === 2) ? 1 : -1;

  // Legs
  ctx.fillStyle = '#3a2614';
  ctx.fillRect(sx - 3 * s, sy - 6 * s - bob, 2.5 * s, 4 * s);
  ctx.fillRect(sx + 0.5 * s, sy - 6 * s - bob, 2.5 * s, 4 * s);

  // Shirt
  ctx.fillStyle = '#c89e60';
  ctx.fillRect(sx - 4 * s, sy - 13 * s - bob, 8 * s, 8 * s);
  ctx.fillStyle = '#a47e44';
  ctx.fillRect(sx - 4 * s, sy - 13 * s - bob, 8 * s, 1.5 * s);   // shoulder highlight

  // Backpack hint
  ctx.fillStyle = '#5a3a20';
  if (flip > 0) ctx.fillRect(sx - 5 * s, sy - 12 * s - bob, 1.5 * s, 5 * s);
  else           ctx.fillRect(sx + 3.5 * s, sy - 12 * s - bob, 1.5 * s, 5 * s);

  // Head
  ctx.fillStyle = '#e8c89a';
  ctx.beginPath();
  ctx.arc(sx, sy - 16 * s - bob, 3.2 * s, 0, Math.PI * 2);
  ctx.fill();

  // Hat (explorer brim)
  ctx.fillStyle = '#5a3a1c';
  ctx.beginPath();
  ctx.ellipse(sx, sy - 18 * s - bob, 5.5 * s, 1.4 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(sx - 2.5 * s, sy - 21 * s - bob, 5 * s, 3 * s);
  // hatband
  ctx.fillStyle = '#3a2410';
  ctx.fillRect(sx - 2.5 * s, sy - 19 * s - bob, 5 * s, 0.8 * s);
}

function render() {
  ctx.fillStyle = '#0a1f0e';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // Camera centered on player's visual position
  const cam = worldToScreen(player.vx, player.vy, player.vElev);
  // Pull camera slightly down so player sits a bit above screen center
  // (more world visible ahead of them)
  const offsetX = VIEW_W / 2 - cam.sx;
  const offsetY = VIEW_H / 2 - cam.sy + 12 * SCALE;

  // Determine visible tile range. The iso projection sends (1,1) to (0, TH)
  // and (1,-1) to (TW, 0), so screen→world inversion is:
  //   wx = sx/TW + sy/TH ; wy = sy/TH − sx/TW
  // We compute corner inversions to find a safe bounding box (plus padding
  // for tall trees and high elevation).
  const corners = [
    [-offsetX,            -offsetY],
    [ VIEW_W - offsetX,   -offsetY],
    [-offsetX,             VIEW_H - offsetY],
    [ VIEW_W - offsetX,    VIEW_H - offsetY]
  ];
  let minWX = Infinity, maxWX = -Infinity;
  let minWY = Infinity, maxWY = -Infinity;
  for (const [sx, sy] of corners) {
    const wx = sx / TILE_W + sy / TILE_H;
    const wy = sy / TILE_H - sx / TILE_W;
    minWX = Math.min(minWX, wx); maxWX = Math.max(maxWX, wx);
    minWY = Math.min(minWY, wy); maxWY = Math.max(maxWY, wy);
  }
  // Padding for elevation pushing tile tops upward + tall decorations
  const padNeg = 8, padPos = 4;
  const x0 = Math.floor(minWX) - padPos;
  const x1 = Math.ceil (maxWX) + padPos;
  const y0 = Math.floor(minWY) - padPos;
  const y1 = Math.ceil (maxWY) + padNeg;

  // Build draw list, sort by (wx+wy) back-to-front
  // Player inserted at its interpolated depth so it occludes correctly
  const list = [];
  for (let wy = y0; wy <= y1; wy++) {
    for (let wx = x0; wx <= x1; wx++) {
      list.push({ kind: 0, wx, wy, depth: wx + wy });
    }
  }
  list.push({ kind: 1, depth: player.vx + player.vy + 0.001 });
  list.sort((a, b) => a.depth - b.depth);

  ctx.save();
  ctx.translate(offsetX, offsetY);
  for (const item of list) {
    if (item.kind === 0) drawTile(item.wx, item.wy);
    else                 drawPlayer();
  }
  ctx.restore();
}

// ════════════════════════════════════════════════════════════════════════════
//  HUD
// ════════════════════════════════════════════════════════════════════════════
const $biome = document.getElementById('biome');
const $pos   = document.getElementById('pos');
const $seed  = document.getElementById('seed');

let hudLastTile = -1;
function updateHUD() {
  const t = world.at(player.x, player.y);
  if (t.type !== hudLastTile) {
    $biome.textContent = BIOME_NAMES[t.type];
    hudLastTile = t.type;
  }
  $pos.textContent  = `${player.x}, ${player.y}`;
  $seed.textContent = seed.toString();
}

// ════════════════════════════════════════════════════════════════════════════
//  Input — touch D-pad + keyboard
// ════════════════════════════════════════════════════════════════════════════
function bindPad() {
  for (const btn of document.querySelectorAll('.pad-btn')) {
    const dir = btn.dataset.dir;
    const press = (e) => {
      e.preventDefault();
      heldDirs.add(dir);
      btn.classList.add('active');
      processInput();
    };
    const release = (e) => {
      e.preventDefault();
      heldDirs.delete(dir);
      btn.classList.remove('active');
    };
    btn.addEventListener('pointerdown',   press,   { passive: false });
    btn.addEventListener('pointerup',     release, { passive: false });
    btn.addEventListener('pointercancel', release, { passive: false });
    btn.addEventListener('pointerleave',  release, { passive: false });
    btn.addEventListener('contextmenu',   (e) => e.preventDefault());
  }
}

const KEYMAP = {
  KeyW: 'up',    ArrowUp:    'up',
  KeyS: 'down',  ArrowDown:  'down',
  KeyA: 'left',  ArrowLeft:  'left',
  KeyD: 'right', ArrowRight: 'right'
};
window.addEventListener('keydown', (e) => {
  const dir = KEYMAP[e.code];
  if (dir) {
    e.preventDefault();
    if (!heldDirs.has(dir)) {
      heldDirs.add(dir);
      processInput();
    }
  } else if (e.code === 'KeyR') {
    rerollWorld();
  }
});
window.addEventListener('keyup', (e) => {
  const dir = KEYMAP[e.code];
  if (dir) heldDirs.delete(dir);
});
// Drop held inputs if focus is lost (e.g. switching apps)
window.addEventListener('blur', () => {
  heldDirs.clear();
  document.querySelectorAll('.pad-btn.active')
          .forEach(b => b.classList.remove('active'));
});

// ════════════════════════════════════════════════════════════════════════════
//  Reroll + URL-hash seed sharing
// ════════════════════════════════════════════════════════════════════════════
function rerollWorld() {
  newWorld();
}
document.getElementById('reroll').addEventListener('click', rerollWorld);
document.getElementById('info-btn').addEventListener('click', () => {
  document.getElementById('splash').style.display = 'flex';
});

// ════════════════════════════════════════════════════════════════════════════
//  Boot
// ════════════════════════════════════════════════════════════════════════════
function initialSeed() {
  const fromHash = parseInt(location.hash.replace('#', ''), 10);
  return isNaN(fromHash) ? undefined : fromHash;
}
newWorld(initialSeed());

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  update(dt);
  render();
  updateHUD();
  requestAnimationFrame(frame);
}

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('splash').style.display = 'none';
  // Fullscreen on mobile if available
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
});

bindPad();
requestAnimationFrame(frame);

// ════════════════════════════════════════════════════════════════════════════
//  Service Worker registration (graceful no-op on file://)
// ════════════════════════════════════════════════════════════════════════════
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.warn('SW registration failed:', err);
    });
  });
}
</script>
</body>
